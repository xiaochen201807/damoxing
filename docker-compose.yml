version: '3.8'

services:
  # ============================================
  # 单容器服务 (前端 Nginx + 后端 Node.js)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${APP_BASE_PATH:-/}
        VITE_API_ROUTE_PREFIX: ${API_ROUTE_PREFIX:-/api}
    container_name: damoxing-app
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - damoxing-net
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/database.sqlite
      - LOG_DIR=/app/data/logs
      - CORS_ORIGIN=*
      # MCP 鉴权密钥 (用于 CherryStudio/Dify 连接)
      - MCP_API_KEY=SY-1234567890
      # 只读模式 (生产环境推荐)
      # - SQLITE_READONLY=true
    volumes:
      # 统一数据目录挂载（包含数据库、日志、备份）
      # data/
      #   ├── database.sqlite    (数据库文件)
      #   ├── logs/              (日志目录)
      #   └── backups/           (备份目录)
      - ./data:/app/data
      # 环境变量文件 (可选)
      - ./server/.env:/app/.env:ro
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# ============================================
# 多副本部署 (可选)
# ============================================
# 如需多副本，取消下面的注释并使用:
# docker-compose up -d --scale app=3
#
# 注意: 多副本需要外部负载均衡器 (如 Nginx)
# 或者使用 Docker Swarm mode

# ============================================
# 自定义网络配置
# ============================================
# 明确指定网络范围，避免与物理网络 192.168.x.x 冲突
networks:
  damoxing-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
