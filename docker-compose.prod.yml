version: '3.8'

services:
  app:
    image: harbor.sjgjj.cn:10443/gjjrgzn/damoxing:202603051100-gjsj
    container_name: damoxing-gjsj
    restart: unless-stopped

    ports:
      - "30200:80"

    networks:
      - damoxing-net

    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/database.sqlite
      - LOG_DIR=/app/data/logs
      - CORS_ORIGIN=https://appcs.jbysoft.com,https://appsy.jbysoft.com,https://app.jbysoft.com
      - DIFY_API_TIMEOUT=300000
      - API_ROUTE_PREFIX=/gjj_gjsjjsmx/api
      - APP_BASE_PATH=/gjj_gjsjjsmx/
      - JWT_SECRET=4671d0ca-6bc0-41e2-95f0-ade07b6eef0c
      - JWT_EXPIRES_IN=24h
      - GATEWAY_VALIDATE_URL=https://appcs.jbysoft.com/tyrz/cheque/validate.service
      - GATEWAY_ENABLED=true
      - SKIP_LOCAL_AUTH=true

    volumes:
      - ./data:/app/data
      - ./config/datasources.json:/app/config/datasources.json:ro

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  damoxing-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
