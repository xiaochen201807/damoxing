version: '3.8'

services:
  app:
    # 使用 GitHub Container Registry 镜像
    image: ghcr.io/xiaoguan521/damoxing:latest

    # 或使用特定版本
    # image: ghcr.io/xiaoguan521/damoxing:v1.0.0

    # 或使用 x86 快速构建版本
    # image: ghcr.io/xiaoguan521/damoxing:x86

    container_name: damoxing-app
    restart: unless-stopped

    ports:
      - "80:80"

    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/database.sqlite
      - LOG_DIR=/app/data/logs
      # CORS 配置（允许 jbysoft.com 子域名访问）
      - CORS_ORIGIN=https://appcs.jbysoft.com,https://appsy.jbysoft.com,https://app.jbysoft.com
      # AI 接口超时时间 (毫秒)，默认 5分钟
      - DIFY_API_TIMEOUT=300000
      # MCP 鉴权密钥 (用于 CherryStudio/Dify 连接)
      - MCP_API_KEY=SY-1234567890
      # 只读模式 (生产环境推荐)
      # - SQLITE_READONLY=true

      # ============================================
      # API 路由前缀配置
      # ============================================
      - API_ROUTE_PREFIX=/gjjrgzn/api

      # ============================================
      # JWT 配置
      # ============================================
      - JWT_SECRET=4671d0ca-6bc0-41e2-95f0-ade07b6eef0c
      - JWT_EXPIRES_IN=24h

      # ============================================
      # 第三方网关配置
      # ============================================
      - GATEWAY_VALIDATE_URL=https://appsy.jbysoft.com/tyrz/cheque/validate.service
      # 网关集成开关（true=启用真实调用，false=使用模拟数据）
      - GATEWAY_ENABLED=true
      # 是否跳过本地用户验证
      - SKIP_LOCAL_AUTH=${SKIP_LOCAL_AUTH}
      # 以下参数作为兜底配置，优先使用前端URL传入的参数
      # - GATEWAY_TICKET=your-ticket-here
      # - GATEWAY_LOGIN_TOKEN=your-login-token-here


    volumes:
      # 统一数据目录挂载（包含数据库、日志、备份）
      # data/
      #   ├── database.sqlite    (数据库文件)
      #   ├── logs/              (日志目录)
      #   └── backups/           (备份目录)
      - ./data:/app/data
      # 环境变量文件 (可选)
      # - ./server/.env:/app/.env:ro

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# ============================================
# 多副本部署 (可选)
# ============================================
# 如需多副本，使用:
# docker-compose up -d --scale app=3
#
# 注意: 多副本需要外部负载均衡器 (如 Nginx)
# 或者使用 Docker Swarm mode
