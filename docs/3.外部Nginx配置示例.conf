# ============================================
# 外部 Nginx 反向代理配置
# ============================================
# 用途：外部 Nginx 代理到 Docker 容器
# 假设容器映射端口：127.0.0.1:8080:80
# ============================================

# 上游服务器定义
upstream damoxing_app {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name appcs.jbysoft.com;
    
    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 文件上传大小限制
    client_max_body_size 100M;
    
    # 日志（记录真实客户端 IP）
    access_log /var/log/nginx/damoxing_access.log;
    error_log /var/log/nginx/damoxing_error.log warn;
    
    # ============================================
    # 应用主体（包含前端和 API）
    # ============================================
    location /gjjrgzn/ {
        proxy_pass http://damoxing_app/gjjrgzn/;
        
        # 请求头透传（重要！）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 超时配置（AI 接口需要较长时间）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # HTTP 版本
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # ============================================
    # SSE 长连接支持（如果使用 MCP SSE）
    # ============================================
    location /gjjrgzn/api/mcp/sse {
        proxy_pass http://damoxing_app/gjjrgzn/api/mcp/sse;
        
        # SSE 专用配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 关键：禁用缓冲，保持长连接
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        
        # 超长连接
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_connect_timeout 10s;
        
        # HTTP/1.1 + Connection 保持
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Upgrade $http_upgrade;
    }
    
   
    
    # ============================================
    # 健康检查（可选，外部监控使用）
    # ============================================
    location = /gjjrgzn/health {
        proxy_pass http://damoxing_app/gjjrgzn/health;
        access_log off;
        
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }

}

# ============================================
# HTTP 自动重定向到 HTTPS
# ============================================
server {
    listen 80;
    server_name appcs.jbysoft.com;
    
    # 将所有 HTTP 请求重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================
# 配置说明
# ============================================
# 1. 确保容器端口映射：docker-compose.prod.yml
#    ports:
#      - "127.0.0.1:8080:80"
#
# 2. 测试配置：nginx -t
#
# 3. 重载配置：nginx -s reload
#
# 4. 查看日志：
#    tail -f /var/log/nginx/damoxing_access.log
#    tail -f /var/log/nginx/damoxing_error.log
#
# 5. SSL 证书路径根据实际情况修改
# ============================================
