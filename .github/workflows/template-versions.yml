name: Update Template Versions

on:
  push:
    branches:
      - '**'

concurrency:
  group: template-versions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-current-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate template versions for this push
        run: |
          node server/scripts/update-template-versions.js \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}"

      - name: Validate generated diff
        run: git diff --check -- server/templates

      - name: Commit versions to current branch
        id: commit
        shell: bash
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- server/templates; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "template-version-bot"
          git config user.email "template-version-bot@users.noreply.github.com"
          git add server/templates
          git commit -m "chore(templates): update generated template versions"
          git push origin "HEAD:$CURRENT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Docker build for generated main branch commit
        if: steps.commit.outputs.changed == 'true' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: gh workflow run docker-build.yml --repo "$GITHUB_REPOSITORY" --ref "$CURRENT_BRANCH"

      - name: Job summary
        shell: bash
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Template versions were generated and committed to \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No template version changes were required for \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
