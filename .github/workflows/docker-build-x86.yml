name: Build x86 Docker Image (Fast)

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发
    inputs:
      v_base_path:
        description: '应用基础路径 (VITE_BASE_PATH)'
        required: false
        default: '/gjj_gjsjjsmx/'
      v_api_prefix:
        description: 'API 路由前缀 (VITE_API_ROUTE_PREFIX)'
        required: false
        default: '/gjj_gjsjjsmx/api'
      v_app_name:
        description: '应用名称 (VITE_APP_NAME)'
        required: false
        default: 'Damoxing'
      v_app_version:
        description: '应用版本 (VITE_APP_VERSION)'
        required: false
        default: '1.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VITE_BASE_PATH: ${{ github.event.inputs.v_base_path || vars.APP_BASE_PATH || '/' }}
  VITE_API_ROUTE_PREFIX: ${{ github.event.inputs.v_api_prefix || vars.API_ROUTE_PREFIX || '/api' }}
  VITE_APP_NAME: ${{ github.event.inputs.v_app_name || vars.VITE_APP_NAME || 'Damoxing' }}
  VITE_APP_VERSION: ${{ github.event.inputs.v_app_version || vars.VITE_APP_VERSION || '1.0.0' }}

jobs:
  build-x86:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare standard SQL private key
        shell: bash
        env:
          STANDARD_SQL_PRIVATE_KEY: ${{ secrets.STANDARD_SQL_PRIVATE_KEY }}
        run: |
          if [[ -z "$STANDARD_SQL_PRIVATE_KEY" ]]; then
            if [[ "${{ github.event_name }}" != "pull_request" ]]; then
              echo "::error::Missing GitHub Actions Secret: STANDARD_SQL_PRIVATE_KEY"
              exit 1
            fi
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out "${RUNNER_TEMP}/standard_sql_private.pem" 2>/dev/null
          else
            printf '%s\n' "$STANDARD_SQL_PRIVATE_KEY" > "${RUNNER_TEMP}/standard_sql_private.pem"
          fi
          chmod 600 "${RUNNER_TEMP}/standard_sql_private.pem"
          openssl pkey -in "${RUNNER_TEMP}/standard_sql_private.pem" -check -noout

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-x86
            type=ref,event=pr,suffix=-x86
            type=semver,pattern={{version}},suffix=-x86
            type=semver,pattern={{major}}.{{minor}},suffix=-x86
            # 使用 git commit hash 作为版本 (例如: main-f0c1d2-x86)
            type=sha,prefix={{branch}}-,suffix=-x86
            # 使用东八区日期-时间作为版本 (例如: 20251217-1345-x86)
            type=raw,value={{date 'YYYYMMDD-HHmm' tz='Asia/Shanghai'}},suffix=-x86
            type=raw,value=x86,enable={{is_default_branch}}

      - name: Build and push x86 Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build-x86
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:x86
          cache-to: type=gha,mode=max,scope=build-x86
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            STANDARD_SQL_KEY_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
            VITE_API_ROUTE_PREFIX=${{ env.VITE_API_ROUTE_PREFIX }}
            VITE_APP_NAME=${{ env.VITE_APP_NAME }}
            VITE_APP_VERSION=${{ env.VITE_APP_VERSION }}
          secret-files: |
            standard_sql_private_key=${{ runner.temp }}/standard_sql_private.pem

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🚀 x86 镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**拉取命令:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:x86" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
