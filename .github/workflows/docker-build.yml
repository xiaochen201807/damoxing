name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  # 移除 pull_request 自动触发，仅手动触发多架构构建
  workflow_dispatch:  # 允许手动触发
    inputs:
      skip_arm:
        description: '跳过 ARM64 构建 (仅构建 x86)'
        required: false
        type: boolean
        default: false
      v_base_path:
        description: '应用基础路径 (VITE_BASE_PATH)'
        required: false
        default: '/gjj_gjsjjsmx/'
      v_api_prefix:
        description: 'API 路由前缀 (VITE_API_ROUTE_PREFIX)'
        required: false
        default: '/gjj_gjsjjsmx/api'
      v_app_name:
        description: '应用名称 (VITE_APP_NAME)'
        required: false
        default: 'Damoxing'
      v_app_version:
        description: '应用版本 (VITE_APP_VERSION)'
        required: false
        default: '1.0.0'

env:
  REGISTRY: ghcr.io
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: shinyue
  IMAGE_NAME: ${{ github.repository }}
  ALIYUN_IMAGE_NAME: shinyue/damoxing
  VITE_BASE_PATH: ${{ github.event.inputs.v_base_path || vars.APP_BASE_PATH || '/' }}
  VITE_API_ROUTE_PREFIX: ${{ github.event.inputs.v_api_prefix || vars.API_ROUTE_PREFIX || '/api' }}
  VITE_APP_NAME: ${{ github.event.inputs.v_app_name || vars.VITE_APP_NAME || 'Damoxing' }}
  VITE_APP_VERSION: ${{ github.event.inputs.v_app_version || vars.VITE_APP_VERSION || '1.0.0' }}

jobs:
  # 并行构建不同架构的镜像
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare platform tag
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "tag=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare standard SQL private key
        shell: bash
        env:
          STANDARD_SQL_PRIVATE_KEY: ${{ secrets.STANDARD_SQL_PRIVATE_KEY }}
        run: |
          if [[ -z "$STANDARD_SQL_PRIVATE_KEY" ]]; then
            echo "::error::Missing GitHub Actions Secret: STANDARD_SQL_PRIVATE_KEY"
            exit 1
          fi
          printf '%s\n' "$STANDARD_SQL_PRIVATE_KEY" > "${RUNNER_TEMP}/standard_sql_private.pem"
          chmod 600 "${RUNNER_TEMP}/standard_sql_private.pem"
          openssl pkey -in "${RUNNER_TEMP}/standard_sql_private.pem" -check -noout

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value={{date 'YYYYMMDD-HHmm' tz='Asia/Shanghai'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push by digest
        id: build
        # 跳过 ARM64 如果手动触发时选择了 skip_arm
        if: ${{ matrix.platform == 'linux/amd64' || (matrix.platform == 'linux/arm64' && github.event.inputs.skip_arm != 'true') }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Aliyun Registry does not accept BuildKit OCI provenance/SBOM manifests.
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ steps.platform.outputs.tag }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.platform.outputs.tag }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          build-args: |
            STANDARD_SQL_KEY_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
            VITE_API_ROUTE_PREFIX=${{ env.VITE_API_ROUTE_PREFIX }}
            VITE_APP_NAME=${{ env.VITE_APP_NAME }}
            VITE_APP_VERSION=${{ env.VITE_APP_VERSION }}
          secret-files: |
            standard_sql_private_key=${{ runner.temp }}/standard_sql_private.pem

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' && steps.build.conclusion == 'success' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' && steps.build.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 合并所有架构的镜像为一个 multi-arch manifest
  merge:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract GHCR metadata (tags, labels)
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value={{date 'YYYYMMDD-HHmm' tz='Asia/Shanghai'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Aliyun metadata (tags, labels)
        id: meta_aliyun
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDDHHmm' tz='Asia/Shanghai'}}-gjsj

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          # 1. GHCR Multi-arch Manifest
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GHCR_DIGEST_REFS=()
          for f in *; do
            [ -f "$f" ] || continue
            GHCR_DIGEST_REFS+=("${GHCR_IMAGE}@sha256:${f}")
          done
          printf 'GHCR Digest Refs:\n'; printf '  %s\n' "${GHCR_DIGEST_REFS[@]}"

          GHCR_TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            GHCR_TAG_ARGS+=("-t" "${tag}")
          done <<< "${{ steps.meta_ghcr.outputs.tags }}"

          echo "Creating GHCR multi-arch manifest..."
          docker buildx imagetools create "${GHCR_TAG_ARGS[@]}" "${GHCR_DIGEST_REFS[@]}"

          # 2. Aliyun Multi-arch Manifest
          ALIYUN_IMAGE="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE_NAME }}"
          ALIYUN_DIGEST_REFS=()
          for f in *; do
            [ -f "$f" ] || continue
            ALIYUN_DIGEST_REFS+=("${ALIYUN_IMAGE}@sha256:${f}")
          done
          printf 'Aliyun Digest Refs:\n'; printf '  %s\n' "${ALIYUN_DIGEST_REFS[@]}"

          ALIYUN_TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            ALIYUN_TAG_ARGS+=("-t" "${tag}")
          done <<< "${{ steps.meta_aliyun.outputs.tags }}"

          echo "Creating Aliyun multi-arch manifest..."
          docker buildx imagetools create "${ALIYUN_TAG_ARGS[@]}" "${ALIYUN_DIGEST_REFS[@]}"

      - name: Inspect published images
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag"
          done <<< "${{ steps.meta_ghcr.outputs.tags }}"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag"
          done <<< "${{ steps.meta_aliyun.outputs.tags }}"

      - name: Multi-arch image summary
        run: |
          set -euo pipefail

          echo "### 多架构镜像构建成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**支持架构:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GHCR 镜像:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**阿里云镜像:** \`${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**本次实际发布的拉取命令:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# GHCR 镜像" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "docker pull $tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.meta_ghcr.outputs.tags }}"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 阿里云镜像（仅 latest 和北京时间版本标签）" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "docker pull $tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.meta_aliyun.outputs.tags }}"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**验证多架构支持:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "docker buildx imagetools inspect $tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.meta_ghcr.outputs.tags }}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "docker buildx imagetools inspect $tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.meta_aliyun.outputs.tags }}"
          echo '```' >> $GITHUB_STEP_SUMMARY
